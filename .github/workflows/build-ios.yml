name: 🧱 Build XCFramework

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    name: 🧱 Build and Upload XCFramework

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧱 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🧹 Clean project
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: 🏗️ Build XCFramework (iOS only)
        run: |
          chmod +x gradlew
          echo "🔨 Building iOS XCFramework..."
          ./gradlew :shared:assembleReleaseIosFatFrameworkForSharedKitXCFramework --no-daemon --stacktrace
          echo "✅ Build completed."

      - name: 🔎 Locate XCFramework
        id: locate
        run: |
          echo "🔎 Searching for XCFramework..."
          FOUND_PATH=$(find shared/build -type d -name "*.xcframework" | head -n 1)
          if [ -z "$FOUND_PATH" ]; then
            echo "❌ No XCFramework found! Checking all build folders..."
            ls -R shared || echo "⚠️ shared folder missing!"
            exit 1
          fi
          echo "✅ Found XCFramework at: $FOUND_PATH"
          echo "path=$FOUND_PATH" >> $GITHUB_OUTPUT

      - name: 📦 Package XCFramework
        run: |
          cd $(dirname "${{ steps.locate.outputs.path }}")
          zip -r sharedKit_v${{ github.run_number }}.zip $(basename "${{ steps.locate.outputs.path }}")
          echo "✅ Zipped XCFramework: sharedKit_v${{ github.run_number }}.zip"

      - name: 🚀 Upload XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharedKit_xcframework_v${{ github.run_number }}
          path: |
            **/sharedKit_v${{ github.run_number }}.zip
