name: Build and Test iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS app, shared engine and simulator tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify App Store build toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK for Gradle configuration
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare app and shared framework
        run: bash iosApp/scripts/prepare.sh

      - name: Test shared engine on iOS
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            bash ./gradlew :shared:iosSimulatorArm64Test
          else
            bash ./gradlew :shared:iosX64Test
          fi

      - name: Run iPhone and iPad tests
        env:
          SKIP_KOTLIN_BUILD: "YES"
        run: bash iosApp/scripts/test-simulators.sh

      - name: Validate unsigned device archive
        env:
          SKIP_KOTLIN_BUILD: "YES"
        run: >-
          xcodebuild archive -project iosApp/Apuntes.xcodeproj -scheme Apuntes
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath iosApp/build/Apuntes.xcarchive CODE_SIGNING_ALLOWED=NO

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            iosApp/build/*.xcresult
            shared/build/reports/tests/
          if-no-files-found: warn

      - name: Upload unsigned archive and framework
        uses: actions/upload-artifact@v4
        with:
          name: Apuntes-iOS-unsigned
          if-no-files-found: error
          path: |
            iosApp/build/Apuntes.xcarchive
            shared/build/XCFrameworks/release/sharedKit.xcframework

