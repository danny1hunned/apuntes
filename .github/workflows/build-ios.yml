name: 🧱 Build iOS XCFramework

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    name: 🧱 Build XCFramework
    runs-on: macos-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧱 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🧹 Clean project
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: 🏗️ Build XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:createXCFramework --stacktrace

      - name: 🔎 Search for built XCFramework
        id: find_framework
        run: |
          echo "🔎 Searching for XCFramework..."
          FOUND_PATH=$(find shared/build -type d -name "*.xcframework" | head -n 1)
          if [ -z "$FOUND_PATH" ]; then
            echo "❌ No XCFramework found!"
            ls -R shared/build || echo "Build folder missing!"
            exit 1
          fi
          echo "✅ Found XCFramework at: $FOUND_PATH"
          echo "path=$FOUND_PATH" >> $GITHUB_OUTPUT

      - name: 📦 Package XCFramework
        run: |
          cd $(dirname "${{ steps.find_framework.outputs.path }}")
          zip -r sharedKit_v${{ github.run_number }}.zip sharedKit.xcframework

      - name: 🚀 Upload XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharedKit_xcframework
          path: shared/build/XCFrameworks/releaseSharedKit/sharedKit.xcframework
